<!DOCTYPE html>
<html lang="cs" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Funky Shared Calendar 🎨✨</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts: Fredoka & Space Grotesk -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            transition: background-color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .funky-title {
            font-family: 'Fredoka', cursive;
        }
        .brut-shadow {
            box-shadow: 4px 4px 0px #000000;
            transition: all 0.1s ease;
        }
        .brut-shadow-sm {
            box-shadow: 2px 2px 0px #000000;
        }
        .brut-shadow:hover {
            transform: translate(-1px, -1px);
            box-shadow: 5px 5px 0px #000000;
        }
        .brut-shadow:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #fff;
            border-left: 2px solid #000;
        }
        ::-webkit-scrollbar-thumb {
            background: #000;
            border-radius: 4px;
        }
    </style>
</head>
<body id="bodyRoot" class="h-full bg-[#FF70A6] text-black flex flex-col selection:bg-black selection:text-white pb-16 md:pb-0">

    <!-- Top Navigation / Header -->
    <header id="headerRoot" class="border-b-4 border-black bg-white px-4 md:px-6 py-3 md:py-4 flex items-center justify-between gap-2 sticky top-0 z-30 transition-colors">
        <div class="flex items-center gap-2 md:gap-3">
            <span id="headerLogoIcon" class="text-2xl md:text-3xl p-1.5 md:p-2 bg-[#FF70A6] border-2 md:border-3 border-black rounded-xl brut-shadow-sm">🍓</span>
            <h1 class="funky-title text-2xl md:text-4xl font-bold tracking-wider uppercase">FUNKY<span id="logoSubTag" class="bg-[#FF9770] text-black px-1.5 md:px-2 py-0.5 ml-1 border-2 border-black rounded-lg inline-block transform -rotate-2 text-xl md:text-3xl">CAL</span></h1>
        </div>

        <!-- Controls: Views & Date Navigation (Desktop) -->
        <div class="hidden md:flex items-center gap-3">
            <div class="flex bg-gray-100 border-2 border-black rounded-xl p-1 brut-shadow-sm">
                <button onclick="changeView('month')" id="btnViewMonth" class="px-3 py-1 font-bold text-sm rounded-lg bg-black text-white transition">Měsíc</button>
                <button onclick="changeView('week')" id="btnViewWeek" class="px-3 py-1 font-bold text-sm rounded-lg hover:bg-gray-200 transition text-black">Týden</button>
                <button onclick="changeView('day')" id="btnViewDay" class="px-3 py-1 font-bold text-sm rounded-lg hover:bg-gray-200 transition text-black">Den</button>
            </div>

            <div class="flex items-center gap-2 border-2 border-black bg-white px-3 py-1.5 rounded-xl brut-shadow-sm">
                <button onclick="navigateDate(-1)" class="font-bold px-2 py-0.5 bg-gray-100 border-2 border-black rounded hover:bg-gray-200 transition text-black">◀</button>
                <span id="currentDateLabel" class="font-bold text-base min-w-[140px] text-center text-black">Leden 2026</span>
                <button onclick="navigateDate(1)" class="font-bold px-2 py-0.5 bg-gray-100 border-2 border-black rounded hover:bg-gray-200 transition text-black">▶</button>
            </div>

            <button onclick="goToToday()" id="btnToday" class="px-3 py-1.5 font-bold text-sm bg-white border-2 border-black text-black rounded-xl brut-shadow hover:bg-gray-100 transition">Dnes</button>
        </div>

        <!-- Mobile Date Navigation -->
        <div class="flex md:hidden items-center gap-1 border-2 border-black bg-white px-2 py-1 rounded-xl brut-shadow-sm">
            <button onclick="navigateDate(-1)" class="font-bold px-2 py-1 bg-gray-100 border border-black rounded active:bg-gray-300 text-black">◀</button>
            <span id="currentDateLabelMobile" class="font-bold text-xs min-w-[90px] text-center text-black truncate">Leden 2026</span>
            <button onclick="navigateDate(1)" class="font-bold px-2 py-1 bg-gray-100 border border-black rounded active:bg-gray-300 text-black">▶</button>
        </div>

        <!-- Desktop Actions -->
        <div class="hidden md:flex items-center gap-3">
            <button onclick="openDesignStudio()" id="btnDesignStudio" class="px-3 py-2 font-bold text-sm bg-[#FFD670] text-black border-2 border-black rounded-xl brut-shadow flex items-center gap-1.5 hover:bg-[#ffcc4d]">
                🎨 Design
            </button>
            <button onclick="openEventModal()" id="btnNewEvent" class="px-4 py-2 font-bold text-sm bg-[#70C1B3] text-black border-2 border-black rounded-xl brut-shadow flex items-center gap-1.5 hover:bg-[#5ab3a2]">
                ✨ Nová Událost
            </button>
        </div>
    </header>

    <!-- Main Content Layout -->
    <main class="flex-1 flex flex-col md:flex-row overflow-hidden">
        <!-- Sidebar: Desktop only -->
        <aside id="sidebarRoot" class="hidden md:flex w-72 bg-white border-r-4 border-black p-5 flex-col gap-6 overflow-y-auto transition-colors">
            <div>
                <h2 class="funky-title text-xl font-bold uppercase mb-3 flex items-center gap-2">
                    <span>🏷️</span> Kategorie
                </h2>
                <div id="categoryFilters" class="flex flex-col gap-2"></div>
            </div>

            <hr class="border-2 border-black border-dashed">

            <div id="dataBackupCard" class="mt-auto bg-gray-50 border-3 border-black p-4 rounded-xl brut-shadow-sm flex flex-col gap-3">
                <h3 class="font-bold text-sm uppercase flex items-center gap-1.5"><span>☁️</span> Cloud Kalendář</h3>
                <p class="text-xs text-gray-700">Data jsou bezpečně uložena v cloudu a sdílená pro všechny.</p>
                <button onclick="loadEventsFromCloud()" class="w-full py-1.5 bg-[#FFD670] text-black text-xs font-bold rounded-lg border-2 border-black hover:bg-[#ffcc4d] transition">🔄 Obnovit data</button>
            </div>
        </aside>

        <!-- Calendar Grid Area -->
        <div id="calendarContainer" class="flex-1 flex flex-col overflow-y-auto p-2 md:p-6 transition-colors"></div>
    </main>

    <!-- MOBILE BOTTOM NAVIGATION BAR -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t-4 border-black z-40 flex items-center justify-around p-2 brut-shadow">
        <button onclick="changeView('month')" id="mBtnMonth" class="flex flex-col items-center gap-0.5 p-1 text-black font-bold text-xs">
            <span class="text-lg">📅</span>
            <span>Měsíc</span>
        </button>
        <button onclick="changeView('week')" id="mBtnWeek" class="flex flex-col items-center gap-0.5 p-1 text-black font-bold text-xs">
            <span class="text-lg">📊</span>
            <span>Týden</span>
        </button>
        <button onclick="openEventModal()" class="flex flex-col items-center justify-center -mt-6 bg-[#70C1B3] text-black border-3 border-black p-3 rounded-full brut-shadow active:scale-95 transition">
            <span class="text-xl font-bold">✨</span>
        </button>
        <button onclick="toggleMobileMenu()" class="flex flex-col items-center gap-0.5 p-1 text-black font-bold text-xs">
            <span class="text-lg">🏷️</span>
            <span>Kategorie</span>
        </button>
        <button onclick="openDesignStudio()" class="flex flex-col items-center gap-0.5 p-1 text-black font-bold text-xs">
            <span class="text-lg">🎨</span>
            <span>Design</span>
        </button>
    </nav>

    <!-- MOBILE CATEGORY DRAWER -->
    <div id="mobileDrawer" class="fixed inset-0 bg-black/60 z-50 hidden md:hidden flex flex-col justify-end" onclick="closeMobileMenu()">
        <div class="bg-white border-t-4 border-black p-5 rounded-t-3xl flex flex-col gap-4 max-h-[80vh] overflow-y-auto" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center border-b-2 border-black pb-2">
                <h3 class="funky-title text-xl font-bold uppercase">Kategorie & Cloud</h3>
                <button onclick="closeMobileMenu()" class="w-8 h-8 font-bold text-lg bg-[#FF0055] text-white border-2 border-black rounded-lg">✕</button>
            </div>
            <div id="categoryFiltersMobile" class="flex flex-col gap-2"></div>
            <hr class="border-2 border-black border-dashed">
            <button onclick="loadEventsFromCloud(); closeMobileMenu();" class="w-full py-2 bg-[#FFD670] text-black font-bold text-xs rounded-xl border-2 border-black">🔄 Obnovit data z cloudu</button>
        </div>
    </div>

    <!-- ================= MODAL: CREATE / EDIT EVENT ================= -->
    <div id="eventModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-3 md:p-4">
        <div class="bg-white text-black border-4 border-black rounded-2xl p-5 md:p-6 w-full max-w-md brut-shadow flex flex-col gap-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b-2 border-black pb-3">
                <h3 id="modalTitle" class="funky-title text-xl md:text-2xl font-bold uppercase">Nová Událost</h3>
                <button onclick="closeEventModal()" class="w-8 h-8 font-bold text-lg bg-[#FF0055] text-white border-2 border-black rounded-lg flex items-center justify-center">✕</button>
            </div>

            <form id="eventForm" onsubmit="saveEvent(event)" class="flex flex-col gap-3 md:gap-4">
                <input type="hidden" id="eventId">
                
                <div class="flex flex-col gap-1">
                    <label class="font-bold text-xs md:text-sm uppercase">Název události *</label>
                    <input type="text" id="eventTitle" required placeholder="např. Narozeninová párty 🎂" 
                           class="border-2 border-black px-3 py-2 rounded-xl bg-gray-50 focus:bg-white focus:outline-none focus:ring-2 focus:ring-black text-black font-medium">
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-bold text-xs md:text-sm uppercase">Tematická ikona ✨</label>
                    <div class="grid grid-cols-6 gap-1.5" id="iconPickerContainer"></div>
                    <input type="hidden" id="eventIcon" value="🎉">
                </div>

                <div class="grid grid-cols-2 gap-2 md:gap-3">
                    <div class="flex flex-col gap-1">
                        <label class="font-bold text-xs md:text-sm uppercase">Datum *</label>
                        <input type="date" id="eventDate" required class="border-2 border-black px-2 md:px-3 py-2 rounded-xl bg-gray-50 text-black font-medium text-xs md:text-sm">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="font-bold text-xs md:text-sm uppercase">Čas</label>
                        <input type="time" id="eventTime" class="border-2 border-black px-2 md:px-3 py-2 rounded-xl bg-gray-50 text-black font-medium text-xs md:text-sm">
                    </div>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-bold text-xs md:text-sm uppercase">Kategorie</label>
                    <select id="eventCategory" class="border-2 border-black px-3 py-2 rounded-xl bg-gray-50 text-black font-medium text-sm"></select>
                </div>

                <div class="flex flex-col gap-1">
                    <label class="font-bold text-xs md:text-sm uppercase">Poznámka / Popis</label>
                    <textarea id="eventDescription" rows="2" placeholder="Podrobnosti..." class="border-2 border-black px-3 py-2 rounded-xl bg-gray-50 text-black font-medium text-sm"></textarea>
                </div>

                <div class="flex items-center justify-between pt-2">
                    <button type="button" id="btnDeleteEvent" onclick="deleteCurrentEvent()" class="px-3 py-2 bg-[#FF0055] text-white font-bold border-2 border-black rounded-xl hidden text-sm">Smazat</button>
                    <div class="flex gap-2 ml-auto">
                        <button type="button" onclick="closeEventModal()" class="px-4 py-2 bg-gray-200 text-black font-bold border-2 border-black rounded-xl text-sm">Zrušit</button>
                        <button type="submit" class="px-5 py-2 bg-[#70C1B3] text-black font-bold border-2 border-black rounded-xl brut-shadow text-sm">Uložit</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- ================= MODAL: DESIGN STUDIO ================= -->
    <div id="designModal" class="fixed inset-0 bg-black/60 backdrop-blur-xs z-50 hidden flex items-center justify-center p-3 md:p-4">
        <div class="bg-white text-black border-4 border-black rounded-2xl p-5 md:p-6 w-full max-w-lg brut-shadow flex flex-col gap-4 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b-2 border-black pb-3">
                <h3 class="funky-title text-xl md:text-2xl font-bold uppercase flex items-center gap-2">🎨 Design Studio</h3>
                <button onclick="closeDesignStudio()" class="w-8 h-8 font-bold text-lg bg-[#FF0055] text-white border-2 border-black rounded-lg flex items-center justify-center">✕</button>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-bold text-xs md:text-sm uppercase">Vyber své téma kalendáře</label>
                <div class="grid grid-cols-2 gap-2 md:gap-3">
                    <button onclick="setTheme('summertime')" class="p-2.5 md:p-3 border-2 border-black rounded-xl bg-[#FF70A6] text-black font-bold text-left brut-shadow-sm flex items-center justify-between text-xs md:text-sm">
                        <span>🍓 Summertime</span>
                        <span class="w-4 h-4 bg-[#FFD670] rounded-full border border-black"></span>
                    </button>
                    <button onclick="setTheme('funky_pop')" class="p-2.5 md:p-3 border-2 border-black rounded-xl bg-[#9D4EDD] text-white font-bold text-left brut-shadow-sm flex items-center justify-between text-xs md:text-sm">
                        <span>🎵 Funky Pop</span>
                        <span class="w-4 h-4 bg-[#FF0055] rounded-full border border-black"></span>
                    </button>
                    <button onclick="setTheme('sexy_time')" class="p-2.5 md:p-3 border-2 border-black rounded-xl bg-[#800020] text-white font-bold text-left brut-shadow-sm flex items-center justify-between text-xs md:text-sm">
                        <span>💋 Sexy Time</span>
                        <span class="w-4 h-4 bg-[#FF0033] rounded-full border border-white"></span>
                    </button>
                    <button onclick="setTheme('larinka_swag')" class="p-2.5 md:p-3 border-2 border-black rounded-xl bg-[#E3D5CA] text-black font-bold text-left brut-shadow-sm flex items-center justify-between text-xs md:text-sm">
                        <span>🐶 Larinka Swag</span>
                        <span class="w-4 h-4 bg-[#D4A373] rounded-full border border-black"></span>
                    </button>
                </div>
            </div>

            <hr class="border-2 border-black border-dashed">

            <div class="flex flex-col gap-3">
                <label class="font-bold text-xs md:text-sm uppercase">Správa kategorií & barev</label>
                <div id="categoryEditList" class="flex flex-col gap-2 max-h-40 overflow-y-auto pr-1"></div>

                <div class="bg-gray-50 border-2 border-black p-2.5 rounded-xl flex items-center gap-2 mt-1">
                    <input type="text" id="newCatName" placeholder="Název nové kategorie" class="border-2 border-black px-2 py-1 rounded-lg bg-white text-xs font-medium flex-1 text-black">
                    <input type="color" id="newCatColor" value="#FF70A6" class="w-8 h-8 border-2 border-black rounded-lg cursor-pointer p-0.5 bg-white">
                    <button onclick="addNewCategory()" class="px-3 py-1 bg-black text-white text-xs font-bold rounded-lg border-2 border-black">Přidat</button>
                </div>
            </div>

            <div class="flex justify-end pt-1">
                <button onclick="closeDesignStudio()" class="px-5 py-2 bg-[#FF70A6] text-black font-bold border-2 border-black rounded-xl brut-shadow text-sm">Hotovo</button>
            </div>
        </div>
    </div>

    <!-- Application Script with Supabase Integration -->
    <script>
        // --- SUPABASE CONFIGURATION ---
        const SUPABASE_URL = 'https://ummxwhmunzmxuigpjphq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVtbXh3aG11bnpteHVpZ3BqcGhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE4ODMwODMsImV4cCI6MjEwNzQ1OTA4M30.MJUkQspRN1HMOrTNvvqqpsYDN5SGpnxCkAUcSAWCZ7Y';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // --- STATE ---
        let currentDate = new Date();
        let currentView = 'month'; 
        
        const availableIcons = ['🎉', '☕', '🚗', '🎂', '✈️', '🔥', '🛒', '💼', '🍸', '❤️', '🐶', '🍕'];

        let categories = [
            { id: 'work', name: 'Práce', color: '#FFD670', active: true },
            { id: 'date', name: 'Rande', color: '#FF70A6', active: true },
            { id: 'party', name: 'Párty', color: '#FF0055', active: true },
            { id: 'fun', name: 'Zábava', color: '#70C1B3', active: true }
        ];

        let events = [];
        let currentTheme = localStorage.getItem('funky_theme') || 'summertime';

        // --- INIT ---
        window.addEventListener('DOMContentLoaded', async () => {
            applyTheme(currentTheme);
            renderIconPicker();
            renderCategoryFilters();
            renderCategorySelects();
            renderCategoryEditList();
            
            // Načtení dat z cloudu
            await loadEventsFromCloud();
            setupRealtimeSubscription();
        });

        // --- SUPABASE CLOUD SYNC ---
        async function loadEventsFromCloud() {
            try {
                const { data, error } = await supabaseClient.from('events').select('*');
                if (error) {
                    console.error('Chyba při načítání z cloudu:', error);
                } else {
                    events = data || [];
                    renderCalendar();
                }
            } catch (err) {
                console.error('Síťová chyba:', err);
            }
        }

        function setupRealtimeSubscription() {
            supabaseClient
                .channel('public:events')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'events' }, payload => {
                    loadEventsFromCloud();
                })
                .subscribe();
        }

        // --- MOBILE MENU ---
        function toggleMobileMenu() {
            document.getElementById('mobileDrawer').classList.toggle('hidden');
        }

        function closeMobileMenu() {
            document.getElementById('mobileDrawer').classList.add('hidden');
        }

        // --- ICON PICKER ---
        function renderIconPicker() {
            const container = document.getElementById('iconPickerContainer');
            container.innerHTML = '';
            const currentSelected = document.getElementById('eventIcon').value;

            availableIcons.forEach(icon => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = `text-lg p-1.5 border-2 border-black rounded-xl flex items-center justify-center transition cursor-pointer ${icon === currentSelected ? 'bg-black text-white' : 'bg-gray-50 text-black hover:bg-gray-200'}`;
                btn.innerText = icon;
                btn.onclick = () => {
                    document.getElementById('eventIcon').value = icon;
                    renderIconPicker();
                };
                container.appendChild(btn);
            });
        }

        // --- NAVIGATION & VIEWS ---
        function changeView(view) {
            currentView = view;
            ['month', 'week', 'day'].forEach(v => {
                const btn = document.getElementById(`btnView${v.charAt(0).toUpperCase() + v.slice(1)}`);
                if (btn) {
                    if (v === view) {
                        btn.className = "px-3 py-1 font-bold text-sm rounded-lg bg-black text-white transition";
                    } else {
                        btn.className = "px-3 py-1 font-bold text-sm rounded-lg hover:bg-gray-200 transition text-black";
                    }
                }
            });
            renderCalendar();
        }

        function navigateDate(direction) {
            if (currentView === 'month') {
                currentDate.setMonth(currentDate.getMonth() + direction);
            } else if (currentView === 'week') {
                currentDate.setDate(currentDate.getDate() + (direction * 7));
            } else if (currentView === 'day') {
                currentDate.setDate(currentDate.getDate() + direction);
            }
            renderCalendar();
        }

        function goToToday() {
            currentDate = new Date();
            renderCalendar();
        }

        // --- CALENDAR RENDERER ---
        function renderCalendar() {
            updateDateLabel();
            const container = document.getElementById('calendarContainer');
            container.innerHTML = '';

            if (currentView === 'month') {
                renderMonthView(container);
            } else if (currentView === 'week') {
                renderWeekView(container);
            } else if (currentView === 'day') {
                renderDayView(container);
            }
        }

        function updateDateLabel() {
            const monthsCzech = ['Leden', 'Únor', 'Březen', 'Duben', 'Květen', 'Červen', 'Červenec', 'Srpen', 'Září', 'Říjen', 'Listopad', 'Prosinec'];
            const label = document.getElementById('currentDateLabel');
            const labelMobile = document.getElementById('currentDateLabelMobile');
            
            let text = '';
            if (currentView === 'month' || currentView === 'week') {
                text = `${monthsCzech[currentDate.getMonth()]} ${currentDate.getFullYear()}`;
            } else {
                const daysCzech = ['Ne', 'Po', 'Út', 'St', 'Čt', 'Pá', 'So'];
                text = `${daysCzech[currentDate.getDay()]} ${currentDate.getDate()}. ${currentDate.getMonth() + 1}.`;
            }

            if (label) label.innerText = text;
            if (labelMobile) labelMobile.innerText = text;
        }

        function getFilteredEvents() {
            const activeCatIds = categories.filter(c => c.active).map(c => c.id);
            return events.filter(e => activeCatIds.includes(e.category));
        }

        // --- MONTH VIEW ---
        function renderMonthView(container) {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            const firstDayOfMonth = new Date(year, month, 1);
            let startDay = firstDayOfMonth.getDay() - 1;
            if (startDay === -1) startDay = 6;

            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const prevMonthDays = new Date(year, month, 0).getDate();

            const gridWrapper = document.createElement('div');
            gridWrapper.className = 'flex-1 flex flex-col border-3 border-black rounded-2xl overflow-hidden brut-shadow bg-black gap-[2px]';

            const daysHeader = document.createElement('div');
            daysHeader.className = 'grid grid-cols-7 bg-white text-black font-bold text-center py-2 border-b-2 border-black text-xs uppercase';
            ['Po', 'Út', 'St', 'Čt', 'Pá', 'So', 'Ne'].forEach(d => {
                const span = document.createElement('span');
                span.innerText = d;
                daysHeader.appendChild(span);
            });
            gridWrapper.appendChild(daysHeader);

            const daysGrid = document.createElement('div');
            daysGrid.className = 'flex-1 grid grid-cols-7 bg-black gap-[2px] auto-rows-fr';

            for (let i = startDay - 1; i >= 0; i--) {
                const dayNum = prevMonthDays - i;
                const cell = document.createElement('div');
                cell.className = 'bg-gray-100/80 p-1 flex flex-col opacity-50 select-none';
                const numSpan = document.createElement('span');
                numSpan.className = 'font-bold text-[10px] w-5 h-5 flex items-center justify-center rounded-lg bg-gray-200 text-gray-600 border border-gray-400';
                numSpan.innerText = dayNum;
                cell.appendChild(numSpan);
                daysGrid.appendChild(cell);
            }

            const activeEvents = getFilteredEvents();
            const todayStr = new Date().toISOString().split('T')[0];

            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                const cell = document.createElement('div');
                
                let cellBgClass = 'bg-white text-black hover:bg-yellow-50';
                if (currentTheme === 'sexy_time') {
                    cellBgClass = 'bg-[#1a0006] text-white hover:bg-[#33000c]';
                } else if (currentTheme === 'funky_pop') {
                    cellBgClass = 'bg-[#f8f0ff] text-black hover:bg-[#eedbff]';
                } else if (currentTheme === 'larinka_swag') {
                    cellBgClass = 'bg-[#faf6f0] text-black hover:bg-[#f0e8dc]';
                }

                cell.className = `${cellBgClass} p-1 flex flex-col gap-0.5 overflow-y-auto cursor-pointer transition min-h-[65px] md:min-h-[85px]`;
                if (dateStr === todayStr) {
                    cell.classList.add(currentTheme === 'sexy_time' ? 'bg-[#600018]' : 'bg-[#fff3a8]');
                }

                cell.onclick = (e) => {
                    if (e.target === cell || e.target.classList.contains('day-number')) {
                        openEventModal(dateStr);
                    }
                };

                const dayHeaderDiv = document.createElement('div');
                dayHeaderDiv.className = 'flex justify-between items-center';
                
                const numSpan = document.createElement('span');
                const isToday = dateStr === todayStr;
                numSpan.className = `day-number font-bold text-xs w-5 h-5 md:w-6 md:h-6 flex items-center justify-center rounded-lg ${isToday ? 'bg-black text-[#FFD670] border-2 border-black' : (currentTheme === 'sexy_time' ? 'bg-[#33000c] text-white border border-red-900' : 'bg-gray-100 text-black border border-black')}`;
                numSpan.innerText = day;
                dayHeaderDiv.appendChild(numSpan);
                cell.appendChild(dayHeaderDiv);

                const dayEvents = activeEvents.filter(e => e.date === dateStr);
                dayEvents.sort((a,b) => (a.time || '').localeCompare(b.time || ''));

                const eventsListDiv = document.createElement('div');
                eventsListDiv.className = 'flex flex-col gap-0.5 mt-0.5';

                dayEvents.forEach(ev => {
                    const cat = categories.find(c => c.id === ev.category) || { color: '#ccc' };
                    const evChip = document.createElement('div');
                    evChip.className = 'text-[10px] md:text-xs font-bold px-1.5 py-0.5 rounded border border-black text-black truncate brut-shadow-sm flex items-center gap-1 cursor-pointer hover:scale-[1.02] transition';
                    evChip.style.backgroundColor = cat.color;
                    evChip.innerHTML = `<span>${ev.icon || '📌'}</span> <span class="truncate">${ev.title}</span>`;
                    evChip.onclick = (e) => {
                        e.stopPropagation();
                        openEventModal(null, ev.id);
                    };
                    eventsListDiv.appendChild(evChip);
                });

                cell.appendChild(eventsListDiv);
                daysGrid.appendChild(cell);
            }

            const totalCellsSoFar = startDay + daysInMonth;
            const remainingCells = totalCellsSoFar <= 35 ? (35 - totalCellsSoFar) : (42 - totalCellsSoFar);
            for (let i = 1; i <= remainingCells; i++) {
                const cell = document.createElement('div');
                cell.className = 'bg-gray-100/80 p-1 flex flex-col opacity-50 select-none';
                const numSpan = document.createElement('span');
                numSpan.className = 'font-bold text-[10px] w-5 h-5 flex items-center justify-center rounded-lg bg-gray-200 text-gray-600 border border-gray-400';
                numSpan.innerText = i;
                cell.appendChild(numSpan);
                daysGrid.appendChild(cell);
            }

            gridWrapper.appendChild(daysGrid);
            container.appendChild(gridWrapper);
        }

        // --- WEEK VIEW ---
        function renderWeekView(container) {
            const curr = new Date(currentDate);
            const firstdayOfWeek = new Date(curr.setDate(curr.getDate() - curr.getDay() + (curr.getDay() === 0 ? -6 : 1)));

            const weekDays = [];
            for (let i = 0; i < 7; i++) {
                const d = new Date(firstdayOfWeek);
                d.setDate(d.getDate() + i);
                weekDays.push(d);
            }

            const gridWrapper = document.createElement('div');
            gridWrapper.className = 'flex-1 flex flex-col border-3 border-black rounded-2xl overflow-hidden brut-shadow bg-black gap-[2px]';

            const daysHeader = document.createElement('div');
            daysHeader.className = 'grid grid-cols-7 bg-white text-black font-bold text-center py-2 border-b-2 border-black text-[10px] md:text-xs uppercase';
            const daysNames = ['Po', 'Út', 'St', 'Čt', 'Pá', 'So', 'Ne'];
            
            weekDays.forEach((d, idx) => {
                const dateStr = d.toISOString().split('T')[0];
                const isToday = dateStr === new Date().toISOString().split('T')[0];
                const span = document.createElement('div');
                span.innerHTML = `${daysNames[idx]}<br><span class="text-[9px] md:text-xs font-normal ${isToday ? 'bg-black text-white px-1 py-0.5 rounded font-bold' : ''}">${d.getDate()}.${d.getMonth()+1}.</span>`;
                daysHeader.appendChild(span);
            });
            gridWrapper.appendChild(daysHeader);

            const daysGrid = document.createElement('div');
            daysGrid.className = 'flex-1 grid grid-cols-7 bg-black gap-[2px]';

            const activeEvents = getFilteredEvents();

            weekDays.forEach(d => {
                const dateStr = d.toISOString().split('T')[0];
                const dayCell = document.createElement('div');

                let cellBgClass = 'bg-white text-black hover:bg-yellow-50';
                if (currentTheme === 'sexy_time') cellBgClass = 'bg-[#1a0006] text-white hover:bg-[#33000c]';
                else if (currentTheme === 'funky_pop') cellBgClass = 'bg-[#f8f0ff] text-black hover:bg-[#eedbff]';
                else if (currentTheme === 'larinka_swag') cellBgClass = 'bg-[#faf6f0] text-black hover:bg-[#f0e8dc]';

                dayCell.className = `${cellBgClass} p-1.5 flex flex-col gap-1 overflow-y-auto cursor-pointer transition min-h-[250px]`;
                dayCell.onclick = () => openEventModal(dateStr);

                const dayEvents = activeEvents.filter(e => e.date === dateStr);
                dayEvents.sort((a,b) => (a.time || '').localeCompare(b.time || ''));

                dayEvents.forEach(ev => {
                    const cat = categories.find(c => c.id === ev.category) || { color: '#ccc' };
                    const evChip = document.createElement('div');
                    evChip.className = 'text-[10px] font-bold p-1 rounded border border-black text-black brut-shadow-sm flex flex-col cursor-pointer hover:scale-[1.02] transition';
                    evChip.style.backgroundColor = cat.color;
                    evChip.innerHTML = `
                        <div class="text-[8px] uppercase font-black opacity-80">${ev.time || 'Celý den'}</div>
                        <div class="font-bold truncate flex items-center gap-1"><span>${ev.icon || '📌'}</span> ${ev.title}</div>
                    `;
                    evChip.onclick = (e) => {
                        e.stopPropagation();
                        openEventModal(null, ev.id);
                    };
                    dayCell.appendChild(evChip);
                });

                daysGrid.appendChild(dayCell);
            });

            gridWrapper.appendChild(daysGrid);
            container.appendChild(gridWrapper);
        }

        // --- DAY VIEW ---
        function renderDayView(container) {
            const dateStr = currentDate.toISOString().split('T')[0];
            const activeEvents = getFilteredEvents().filter(e => e.date === dateStr);
            activeEvents.sort((a,b) => (a.time || '').localeCompare(b.time || ''));

            const wrapper = document.createElement('div');
            let bgWrapper = currentTheme === 'sexy_time' ? 'bg-[#1a0006] text-white' : 'bg-white text-black';

            wrapper.className = `flex-1 flex flex-col border-3 border-black rounded-2xl ${bgWrapper} p-4 md:p-6 brut-shadow gap-4 overflow-y-auto`;

            const headerBox = document.createElement('div');
            headerBox.className = 'flex justify-between items-center border-b-2 border-black pb-3';
            headerBox.innerHTML = `
                <div>
                    <h2 class="funky-title text-xl md:text-2xl font-bold uppercase">Detail dne</h2>
                    <p class="text-xs md:text-sm font-medium ${currentTheme === 'sexy_time' ? 'text-gray-300' : 'text-gray-600'}">${currentDate.toLocaleDateString('cs-CZ', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                </div>
                <button onclick="openEventModal('${dateStr}')" class="px-3 py-1.5 bg-[#70C1B3] text-black font-bold border-2 border-black rounded-xl brut-shadow hover:bg-[#5ab3a2] transition text-xs md:text-sm">+ Přidat událost</button>
            `;
            wrapper.appendChild(headerBox);

            const listContainer = document.createElement('div');
            listContainer.className = 'flex flex-col gap-2.5';

            if (activeEvents.length === 0) {
                listContainer.innerHTML = `
                    <div class="text-center py-8 ${currentTheme === 'sexy_time' ? 'text-gray-400 border-gray-700' : 'text-gray-400 border-gray-300'} font-bold border-2 border-dashed rounded-xl text-sm">
                        Žádné naplánované události pro tento den. 🌴
                    </div>
                `;
            } else {
                activeEvents.forEach(ev => {
                    const cat = categories.find(c => c.id === ev.category) || { color: '#ccc', name: 'Ostatní' };
                    const card = document.createElement('div');
                    card.className = 'border-2 md:border-3 border-black p-3 rounded-xl flex items-center justify-between gap-3 brut-shadow-sm text-black';
                    card.style.backgroundColor = cat.color;
                    card.innerHTML = `
                        <div class="flex items-center gap-3">
                            <span class="text-xl">${ev.icon || '📌'}</span>
                            <div class="px-2 py-1 bg-black text-white font-bold text-[10px] md:text-xs rounded border border-black">${ev.time || 'Celý den'}</div>
                            <div>
                                <h4 class="font-bold text-sm md:text-base">${ev.title}</h4>
                                ${ev.description ? `<p class="text-xs text-gray-800 font-medium">${ev.description}</p>` : ''}
                                <span class="inline-block mt-0.5 text-[9px] font-bold uppercase px-1.5 py-0.5 rounded border border-black bg-white text-black">${cat.name}</span>
                            </div>
                        </div>
                        <button onclick="openEventModal(null, '${ev.id}')" class="px-2.5 py-1 bg-white text-black font-bold text-xs border border-black rounded-lg hover:bg-gray-100 transition">Upravit</button>
                    `;
                    listContainer.appendChild(card);
                });
            }

            wrapper.appendChild(listContainer);
            container.appendChild(wrapper);
        }

        // --- CATEGORIES & FILTERS ---
        function renderCategoryFilters() {
            const container = document.getElementById('categoryFilters');
            const containerMobile = document.getElementById('categoryFiltersMobile');
            
            const html = categories.map(cat => `
                <label class="flex items-center gap-2.5 p-2 bg-gray-50 text-black border-2 border-black rounded-xl cursor-pointer hover:bg-gray-100 transition font-bold text-sm select-none">
                    <input type="checkbox" ${cat.active ? 'checked' : ''} onchange="toggleCategory('${cat.id}')" class="w-4 h-4 accent-black rounded border-2 border-black cursor-pointer">
                    <span class="w-3.5 h-3.5 rounded-full border border-black inline-block" style="background-color: ${cat.color};"></span>
                    <span class="truncate">${cat.name}</span>
                </label>
            `).join('');

            if (container) container.innerHTML = html;
            if (containerMobile) containerMobile.innerHTML = html;
        }

        function toggleCategory(catId) {
            const cat = categories.find(c => c.id === catId);
            if (cat) {
                cat.active = !cat.active;
                renderCalendar();
            }
        }

        function renderCategorySelects() {
            const select = document.getElementById('eventCategory');
            select.innerHTML = '';
            categories.forEach(cat => {
                const opt = document.createElement('option');
                opt.value = cat.id;
                opt.innerText = cat.name;
                select.appendChild(opt);
            });
        }

        function renderCategoryEditList() {
            const container = document.getElementById('categoryEditList');
            container.innerHTML = '';

            categories.forEach(cat => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 bg-white text-black p-1.5 border-2 border-black rounded-xl';
                row.innerHTML = `
                    <input type="color" value="${cat.color}" onchange="updateCatColor('${cat.id}', this.value)" class="w-6 h-6 border border-black rounded cursor-pointer p-0 bg-white">
                    <input type="text" value="${cat.name}" onchange="updateCatName('${cat.id}', this.value)" class="border border-black px-2 py-0.5 text-xs rounded font-medium flex-1 bg-gray-50 text-black">
                    <button onclick="deleteCategory('${cat.id}')" class="px-2 py-0.5 bg-[#FF0055] text-white text-xs font-bold rounded border border-black">✕</button>
                `;
                container.appendChild(row);
            });
        }

        function updateCatColor(id, color) {
            const cat = categories.find(c => c.id === id);
            if (cat) {
                cat.color = color;
                renderCalendar();
                renderCategoryFilters();
            }
        }

        function updateCatName(id, name) {
            const cat = categories.find(c => c.id === id);
            if (cat) {
                cat.name = name;
                renderCategoryFilters();
                renderCategorySelects();
            }
        }

        function addNewCategory() {
            const nameInput = document.getElementById('newCatName');
            const colorInput = document.getElementById('newCatColor');
            const name = nameInput.value.trim();

            if (!name) return;

            const newId = 'cat_' + Date.now();
            categories.push({ id: newId, name: name, color: colorInput.value, active: true });

            nameInput.value = '';
            renderCategoryFilters();
            renderCategorySelects();
            renderCategoryEditList();
            renderCalendar();
        }

        function deleteCategory(id) {
            if (categories.length <= 1) {
                alert('Musí zůstat alespoň jedna kategorie!');
                return;
            }
            categories = categories.filter(c => c.id !== id);
            renderCategoryFilters();
            renderCategorySelects();
            renderCategoryEditList();
            renderCalendar();
        }

        // --- EVENT MODAL & CRUD (SUPABASE SYNCED) ---
        function openEventModal(dateStr = null, eventId = null) {
            const modal = document.getElementById('eventModal');
            const form = document.getElementById('eventForm');
            const titleEl = document.getElementById('modalTitle');
            const btnDelete = document.getElementById('btnDeleteEvent');

            form.reset();
            document.getElementById('eventId').value = '';
            document.getElementById('eventIcon').value = '🎉';
            renderIconPicker();

            if (eventId) {
                const ev = events.find(e => e.id === eventId);
                if (ev) {
                    titleEl.innerText = 'Upravit událost';
                    document.getElementById('eventId').value = ev.id;
                    document.getElementById('eventTitle').value = ev.title;
                    document.getElementById('eventIcon').value = ev.icon || '🎉';
                    document.getElementById('eventDate').value = ev.date;
                    document.getElementById('eventTime').value = ev.time || '';
                    document.getElementById('eventCategory').value = ev.category;
                    document.getElementById('eventDescription').value = ev.description || '';
                    renderIconPicker();
                    btnDelete.classList.remove('hidden');
                }
            } else {
                titleEl.innerText = 'Nová Událost';
                const today = dateStr || new Date().toISOString().split('T')[0];
                document.getElementById('eventDate').value = today;
                btnDelete.classList.add('hidden');
            }

            modal.classList.remove('hidden');
        }

        function closeEventModal() {
            document.getElementById('eventModal').classList.add('hidden');
        }

        async function saveEvent(e) {
            e.preventDefault();
            const id = document.getElementById('eventId').value;
            const title = document.getElementById('eventTitle').value;
            const icon = document.getElementById('eventIcon').value;
            const date = document.getElementById('eventDate').value;
            const time = document.getElementById('eventTime').value;
            const category = document.getElementById('eventCategory').value;
            const description = document.getElementById('eventDescription').value;

            const eventData = {
                title, icon, date, time, category, description
            };

            if (id) {
                // Update
                const { error } = await supabaseClient.from('events').update(eventData).eq('id', id);
                if (error) alert('Chyba při úpravě: ' + error.message);
            } else {
                // Insert
                eventData.id = 'ev_' + Date.now();
                const { error } = await supabaseClient.from('events').insert([eventData]);
                if (error) alert('Chyba při ukládání: ' + error.message);
            }

            closeEventModal();
            loadEventsFromCloud();
        }

        async function deleteCurrentEvent() {
            const id = document.getElementById('eventId').value;
            if (id && confirm('Opravdu chceš tuto událost smazat?')) {
                const { error } = await supabaseClient.from('events').delete().eq('id', id);
                if (error) {
                    alert('Chyba při mazání: ' + error.message);
                } else {
                    closeEventModal();
                    loadEventsFromCloud();
                }
            }
        }

        // --- DESIGN STUDIO & THEMES ---
        function openDesignStudio() {
            document.getElementById('designModal').classList.remove('hidden');
        }

        function closeDesignStudio() {
            document.getElementById('designModal').classList.add('hidden');
        }

        function setTheme(theme) {
            currentTheme = theme;
            localStorage.setItem('funky_theme', theme);
            applyTheme(theme);
            renderCalendar();
        }

        function applyTheme(theme) {
            const body = document.getElementById('bodyRoot');
            const logoIcon = document.getElementById('headerLogoIcon');
            const logoSubTag = document.getElementById('logoSubTag');

            if (theme === 'summertime') {
                body.className = "h-full bg-[#FF70A6] text-black flex flex-col selection:bg-black selection:text-white pb-16 md:pb-0";
                logoIcon.innerText = '🍓';
                logoIcon.className = "text-2xl md:text-3xl p-1.5 md:p-2 bg-[#FF70A6] border-2 md:border-3 border-black rounded-xl brut-shadow-sm";
                logoSubTag.className = "bg-[#FF9770] text-black px-1.5 md:px-2 py-0.5 ml-1 border-2 border-black rounded-lg inline-block transform -rotate-2 text-xl md:text-3xl";
            } else if (theme === 'funky_pop') {
                body.className = "h-full bg-[#9D4EDD] text-black flex flex-col selection:bg-black selection:text-white pb-16 md:pb-0";
                logoIcon.innerText = '🎵';
                logoIcon.className = "text-2xl md:text-3xl p-1.5 md:p-2 bg-[#FFD670] border-2 md:border-3 border-black rounded-xl brut-shadow-sm";
                logoSubTag.className = "bg-[#FF0055] text-white px-1.5 md:px-2 py-0.5 ml-1 border-2 border-black rounded-lg inline-block transform -rotate-2 text-xl md:text-3xl";
            } else if (theme === 'sexy_time') {
                body.className = "h-full bg-[#800020] text-white flex flex-col selection:bg-[#FF0033] selection:text-white pb-16 md:pb-0";
                logoIcon.innerText = '💋';
                logoIcon.className = "text-2xl md:text-3xl p-1.5 md:p-2 bg-[#FF0033] text-white border-2 md:border-3 border-black rounded-xl brut-shadow-sm";
                logoSubTag.className = "bg-black text-white px-1.5 md:px-2 py-0.5 ml-1 border-2 border-black rounded-lg inline-block transform -rotate-2 text-xl md:text-3xl";
            } else if (theme === 'larinka_swag') {
                body.className = "h-full bg-[#E3D5CA] text-black flex flex-col selection:bg-black selection:text-white pb-16 md:pb-0";
                logoIcon.innerText = '🐶';
                logoIcon.className = "text-2xl md:text-3xl p-1.5 md:p-2 bg-[#D4A373] border-2 md:border-3 border-black rounded-xl brut-shadow-sm";
                logoSubTag.className = "bg-[#CCD5AE] text-black px-1.5 md:px-2 py-0.5 ml-1 border-2 border-black rounded-lg inline-block transform -rotate-2 text-xl md:text-3xl";
            }
        }
    </script>
</body>
</html>
